name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="neurox_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/${BINARY}" .

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "neurox_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "neurox_${{ matrix.goos }}_${{ matrix.goarch }}.exe"
          else
            tar -czf "neurox_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "neurox_${{ matrix.goos }}_${{ matrix.goarch }}"
          fi

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
