name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc gcc-aarch64-linux-gnu

      - name: Build linux/amd64
        env:
          CGO_ENABLED: "1"
          CC: x86_64-linux-gnu-gcc
        run: |
          GOARCH=amd64 GOOS=linux CGO_ENABLED=1 CC=x86_64-linux-gnu-gcc \
            go build -tags fts5 -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o dist/neurox_linux_amd64 .
          tar -czf dist/neurox_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz \
            -C dist neurox_linux_amd64

      - name: Build linux/arm64
        run: |
          GOARCH=arm64 GOOS=linux CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc \
            go build -tags fts5 -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o dist/neurox_linux_arm64 .
          tar -czf dist/neurox_${GITHUB_REF_NAME#v}_linux_arm64.tar.gz \
            -C dist neurox_linux_arm64

      - name: Upload linux artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build darwin/amd64
        run: |
          GOARCH=amd64 GOOS=darwin CGO_ENABLED=1 \
            go build -tags fts5 -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o dist/neurox_darwin_amd64 .
          tar -czf dist/neurox_${GITHUB_REF_NAME#v}_darwin_amd64.tar.gz \
            -C dist neurox_darwin_amd64

      - name: Build darwin/arm64
        run: |
          GOARCH=arm64 GOOS=darwin CGO_ENABLED=1 \
            go build -tags fts5 -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o dist/neurox_darwin_arm64 .
          tar -czf dist/neurox_${GITHUB_REF_NAME#v}_darwin_arm64.tar.gz \
            -C dist neurox_darwin_arm64

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
