version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: neurox
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - name: neurox
    repository:
      owner: joeldevz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/joeldevz/neurox
    description: "Brain-inspired memory engine for AI coding agents"
    license: MIT
    install: |
      bin.install "neurox"
    test: |
      system "#{bin}/neurox", "version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
