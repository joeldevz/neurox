name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install cross-compiler
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: |
          BINARY="neurox_linux_${{ matrix.goarch }}"
          go build -tags sqlite_fts5 -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/${BINARY}" .

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          tar -czf "neurox_${VERSION}_linux_${{ matrix.goarch }}.tar.gz" "neurox_linux_${{ matrix.goarch }}"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  release-darwin:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="neurox_darwin_${{ matrix.goarch }}"
          go build -tags sqlite_fts5 -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/${BINARY}" .

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          tar -czf "neurox_${VERSION}_darwin_${{ matrix.goarch }}.tar.gz" "neurox_darwin_${{ matrix.goarch }}"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  release-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        shell: bash
        run: |
          go build -tags sqlite_fts5 -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/neurox.exe" .

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          7z a "neurox_${VERSION}_windows_amd64.zip" "neurox.exe"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  update-homebrew:
    needs: [release-linux, release-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Download release tarballs and compute sha256
          declare -A SHAS
          for PLATFORM in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
            URL="https://github.com/joeldevz/neurox/releases/download/v${VERSION}/neurox_${VERSION}_${PLATFORM}.tar.gz"
            SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
            SHAS[$PLATFORM]="$SHA"
          done

          # Clone the tap repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/joeldevz/homebrew-tap.git tap
          cd tap

          # Generate updated formula
          cat > Formula/neurox.rb << RUBY
          class Neurox < Formula
            desc "Persistent memory for AI coding agents — brain-inspired, local-first"
            homepage "https://github.com/joeldevz/neurox"
            version "${VERSION}"
            license "BSL-1.1"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/joeldevz/neurox/releases/download/v${VERSION}/neurox_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHAS[darwin_arm64]}"
              else
                url "https://github.com/joeldevz/neurox/releases/download/v${VERSION}/neurox_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHAS[darwin_amd64]}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/joeldevz/neurox/releases/download/v${VERSION}/neurox_${VERSION}_linux_arm64.tar.gz"
                sha256 "${SHAS[linux_arm64]}"
              else
                url "https://github.com/joeldevz/neurox/releases/download/v${VERSION}/neurox_${VERSION}_linux_amd64.tar.gz"
                sha256 "${SHAS[linux_amd64]}"
              end
            end

            def install
              binary = Dir["neurox_*"].first
              if binary
                bin.install binary => "neurox"
              else
                bin.install "neurox"
              end
            end

            test do
              assert_match "neurox v#{version}", shell_output("#{bin}/neurox version")
            end
          end
          RUBY

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/neurox.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/neurox.rb
          git commit -m "chore: bump neurox to v${VERSION}" || exit 0
          git push
